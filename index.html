<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080b12">
    <meta name="description" content="Examora - Online Learning & Examination Platform">

    <!-- PWA Manifest & Support -->
    <link rel="manifest" href="./manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Examora">

    <!-- PWA Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">

    <title>Examora</title>

    <!-- Global & Progress CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/progress.css">

    <!-- Component CSS -->
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/hero.css">
    <link rel="stylesheet" href="css/category.css">
    <link rel="stylesheet" href="css/test.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/menu.css">
</head>

<body>
    <!-- Progress Bar -->
    <div id="pageProgress" class="page-progress" aria-hidden="true">
        <div class="page-progress-bar"></div>
    </div>

    <!-- App Containers -->
    <div id="header"></div>
    <div id="menu"></div>
    <div id="hero"></div>
    <div id="category"></div>
    <div id="tests"></div>
    <div id="footer"></div>

    <!-- Scripts -->
    <script src="js/progress.js"></script>
    <script src="js/app.js"></script>

    <!-- Service Worker -->
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker
                    .register("./sw.js")
                    .then(registration => {
                        console.log("Examora Service Worker registered:", registration.scope);
                    })
                    .catch(error => {
                        console.error("Service Worker registration failed:", error);
                    });
            });
        }
    </script>
</body>

</html>
