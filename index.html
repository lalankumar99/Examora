<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#080b12"
    >

    <meta
        name="description"
        content="Examora - Online Learning & Examination Platform"
    >

    <!-- =====================================================
     EXAMORA PWA
====================================================== -->

<!-- PWA Manifest -->
<link
    rel="manifest"
    href="./manifest.json"
>


<!-- Browser / PWA Theme -->
<meta
    name="theme-color"
    content="#080b12"
>


<!-- Mobile Web App -->
<meta
    name="mobile-web-app-capable"
    content="yes"
>


<!-- Apple PWA Support -->
<meta
    name="apple-mobile-web-app-capable"
    content="yes"
>


<meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
>


<meta
    name="apple-mobile-web-app-title"
    content="Examora"
>


<!-- PWA Icons -->
<link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="./icons/icon-192.png"
>


<link
    rel="apple-touch-icon"
    href="./icons/icon-192.png"
>

    <title>Examora</title>

    


    <!-- =========================
         GLOBAL CSS
    ========================== -->

    <link rel="stylesheet" href="css/style.css">


    <!-- =========================
         PROGRESS CSS
    ========================== -->

    <link rel="stylesheet" href="css/progress.css">


    <!-- =========================
         COMPONENT CSS
    ========================== -->

    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/hero.css">
    <link rel="stylesheet" href="css/category.css">
    <link rel="stylesheet" href="css/test.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/menu.css">

</head>


<body>


    <!-- =========================
         PROGRESS
    ========================== -->

    <div
        id="pageProgress"
        class="page-progress"
        role="progressbar"
        aria-label="Page loading"
        aria-hidden="true"
    >

        <div class="page-progress-bar"></div>

    </div>


    <!-- =========================
         HEADER
    ========================== -->

    <div id="header"></div>


    <!-- =========================
         MENU
    ========================== -->

    <div id="menu"></div>


    <!-- =========================
         HERO
    ========================== -->

    <div id="hero"></div>


    <!-- =========================
         CATEGORY
    ========================== -->

    <div id="category"></div>


    <!-- =========================
         TESTS
    ========================== -->

    <div id="tests"></div>


    <!-- =========================
         FOOTER
    ========================== -->

    <div id="footer"></div>


    <!-- =========================
         PROGRESS JS
    ========================== -->

    <script src="js/progress.js"></script>


    <!-- =========================
         MAIN APP
    ========================== -->

    <script src="js/app.js"></script>
<!-- ================================
     EXAMORA SERVICE WORKER
================================ -->

<script>

    if ("serviceWorker" in navigator) {

        window.addEventListener(
            "load",
            () => {

                navigator.serviceWorker
                    .register("./sw.js")
                    .then(
                        registration => {

                            console.log(
                                "Examora Service Worker registered:",
                                registration.scope
                            );

                        }
                    )
                    .catch(
                        error => {

                            console.error(
                                "Service Worker registration failed:",
                                error
                            );

                        }
                    );

            }
        );

    }

</script>


</body>


</html>
